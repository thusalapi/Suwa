# Suwa production stack on one EC2 instance. Reachable ONLY over Tailscale — no ports published.
# Setup and operations: deploy/aws/README.md
#
#   docker compose up -d                                  # start (or update after a new build)
#   docker compose run --rm tools npm run db:deploy       # apply migrations
#   docker compose run --rm tools npm run backup          # backup now (the timer runs it nightly)

name: suwa

services:
  # Joins the tailnet as "suwa" and serves HTTPS on https://suwa.<tailnet>.ts.net with an
  # automatic certificate, proxying to the app over the shared network namespace.
  tailscale:
    image: tailscale/tailscale:stable
    hostname: suwa
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}              # tagged (tag:suwa-app), pre-approved, reusable=false
      TS_HOSTNAME: ${TS_HOSTNAME:-suwa}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_EXTRA_ARGS: --advertise-tags=tag:suwa-app
      TS_USERSPACE: "false"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE

  # The Next.js server. Shares the tailscale container's network, listens on 127.0.0.1:3000 only,
  # so the sole way in is Tailscale serve.
  app:
    image: ${SUWA_APP_IMAGE:-suwa-app:latest}
    build:
      context: ../..
      target: app
    restart: unless-stopped
    network_mode: service:tailscale
    depends_on:
      - tailscale
    env_file: .env
    environment:
      NODE_ENV: production
      HOSTNAME: 127.0.0.1
      PORT: "3000"

  # One-off and scheduled jobs (migrations, clinic provisioning, seeding, backups, restores).
  # Not started by `up`; run with `docker compose run --rm tools <command>`.
  tools:
    image: ${SUWA_TOOLS_IMAGE:-suwa-tools:latest}
    build:
      context: ../..
      target: tools
    profiles: ["tools"]
    env_file: .env
    environment:
      BACKUP_DIR: /app/backups
    volumes:
      - backups:/app/backups

volumes:
  tailscale-state:
  backups:
