# Suwa pilot stack on ONE server (Oracle Cloud Always Free ARM, or any small Linux VM):
# Tailscale + the app + PostgreSQL. Reachable ONLY over Tailscale — no ports published.
# Setup and operations: deploy/oracle/README.md
#
#   docker compose up -d                                  # start (or update after a new build)
#   docker compose run --rm tools npm run db:deploy       # apply migrations
#   docker compose run --rm tools npm run backup          # backup now (the timer runs it nightly)

name: suwa

services:
  # Joins the tailnet as "suwa" and serves HTTPS on https://suwa.<tailnet>.ts.net with an
  # automatic certificate. The app, database and tools all share this container's network
  # namespace, so they talk to each other on 127.0.0.1 and nothing is published on the host.
  tailscale:
    image: tailscale/tailscale:stable
    hostname: suwa
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}              # tagged (tag:suwa-app), pre-approved, reusable=false
      TS_HOSTNAME: ${TS_HOSTNAME:-suwa}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_EXTRA_ARGS: --advertise-tags=tag:suwa-app
      TS_USERSPACE: "false"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ../aws/tailscale/serve.json:/config/serve.json:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # PostgreSQL on the same server. Listens on 127.0.0.1 only (inside the shared namespace), so it
  # is not reachable from the tailnet or the internet. Data lives in the db-data volume; the
  # nightly encrypted dump (tools → backup) is the only copy off this server.
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    network_mode: service:tailscale
    depends_on:
      - tailscale
    command: ["postgres", "-c", "listen_addresses=127.0.0.1", "-c", "max_connections=40"]
    environment:
      POSTGRES_USER: suwa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: suwa
      TZ: UTC
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U suwa -d suwa"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging: *logging

  # The Next.js server. Listens on 127.0.0.1:3000 only, so the sole way in is Tailscale serve.
  app:
    image: ${SUWA_APP_IMAGE:-suwa-app:latest}
    build:
      context: ../..
      target: app
    restart: unless-stopped
    network_mode: service:tailscale
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment: &app-env
      NODE_ENV: production
      HOSTNAME: 127.0.0.1
      PORT: "3000"
      # Built here so the password is written once. POSTGRES_PASSWORD must be URL-safe (hex).
      DATABASE_URL: postgresql://suwa:${POSTGRES_PASSWORD}@127.0.0.1:5432/suwa
    logging: *logging

  # One-off and scheduled jobs (migrations, clinic provisioning, seeding, backups, restores).
  # Not started by `up`; run with `docker compose --profile tools run --rm tools <command>`.
  tools:
    image: ${SUWA_TOOLS_IMAGE:-suwa-tools:latest}
    build:
      context: ../..
      target: tools
    profiles: ["tools"]
    network_mode: service:tailscale
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      <<: *app-env
      BACKUP_DIR: /app/backups
    volumes:
      - backups:/app/backups

volumes:
  tailscale-state:
  db-data:
  backups:
